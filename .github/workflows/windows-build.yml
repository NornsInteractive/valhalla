name: Multi-platform Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths:
      - '.github/workflows/windows-build.yml'
      - 'lib/**'
      - 'windows/**'
      - 'android/**'
      - 'linux/**'
      - 'macos/**'
      - 'ios/**'
      - 'packages/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - 'analysis_options.yaml'

permissions:
  contents: read

env:
  VALHALLA_PUBLISHER: 'Norns Interactive'

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  preflight:
    name: Check source version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          test "$RELEASE_TAG" = "v$version" || {
            echo "Release tag must match pubspec.yaml version v$version" >&2
            exit 1
          }

  build:
    name: Windows x64 release
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Matches the local framework revision and SDK-pinned lockfile packages.
          flutter-version: '3.38.1'
          channel: stable
          architecture: x64
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Build Windows release
        run: |
          flutter build windows --release
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Package complete Windows bundle
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($required in @('valhalla.exe', 'flutter_windows.dll', 'data/icudtl.dat', 'data/flutter_assets')) {
            if (!(Test-Path (Join-Path $bundle $required))) {
              throw "Incomplete Windows bundle: $required is missing"
            }
          }
          $output = 'build/windows-artifacts'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $version = (Get-Content pubspec.yaml | Select-String '^version:').Line
          @(
            'Valhalla Windows x64 release'
            "developer: $env:VALHALLA_PUBLISHER"
            "organization: $env:VALHALLA_PUBLISHER"
            $version
            "commit: $env:BUILD_SHA"
            "run: $env:BUILD_RUN"
            "built_utc: $([DateTime]::UtcNow.ToString('o'))"
            "flutter: $(flutter --version --machine)"
            'Extract the entire ZIP and launch valhalla.exe. Keep DLLs and data together.'
            'Requires Windows 10/11 x64 and the Microsoft Visual C++ x64 runtime.'
          ) | Set-Content (Join-Path $bundle 'BUILD-INFO.txt') -Encoding utf8
          $zip = Join-Path $output "valhalla-windows-x64-$env:BUILD_RUN.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $zip -CompressionLevel Optimal
          $digest = Get-FileHash $zip -Algorithm SHA256
          "$($digest.Hash.ToLower())  $([IO.Path]::GetFileName($zip))" |
            Set-Content "$zip.sha256" -Encoding ascii
          @(
            '### Windows x64 release'
            "Developer / team: $env:VALHALLA_PUBLISHER"
            "Commit: ``$env:BUILD_SHA``"
            "SHA256: ``$($digest.Hash.ToLower())``"
            'Download the artifact below. Extract the inner ZIP completely before launching valhalla.exe.'
            'Compilation does not prove real server/Agent or Windows desktop functionality.'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valhalla-windows-x64-${{ github.run_number }}
          path: build/windows-artifacts/*
          if-no-files-found: error
          retention-days: 14

  native:
    name: ${{ matrix.platform }} release
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
            package: android-signed
          - platform: linux
            runner: ubuntu-24.04
            package: linux-x64
          - platform: macos
            runner: macos-15-intel
            package: macos-universal-unsigned
          - platform: ios
            runner: macos-15-intel
            package: ios-arm64-unsigned
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android release keystore
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VALHALLA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VALHALLA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VALHALLA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 VALHALLA_ANDROID_STORE_PASSWORD VALHALLA_ANDROID_KEY_ALIAS VALHALLA_ANDROID_KEY_PASSWORD; do
            test -n "${!variable}" || { echo "Missing signing secret: $variable" >&2; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/valhalla-release.p12"
          test -s "$RUNNER_TEMP/valhalla-release.p12"
          echo "VALHALLA_ANDROID_KEYSTORE=$RUNNER_TEMP/valhalla-release.p12" >> "$GITHUB_ENV"

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config file libgtk-3-dev \
            libstdc++-12-dev libsecret-1-dev libmpv-dev libepoxy-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          architecture: x64
          cache: true

      - name: Resolve dependencies and localizations
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: Run logic tests
        if: matrix.platform == 'linux'
        run: flutter test --no-pub

      - name: Build native release
        env:
          PLATFORM: ${{ matrix.platform }}
          VALHALLA_ANDROID_STORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          VALHALLA_ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          VALHALLA_ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          case "$PLATFORM" in
            android)
              # Release builds must regenerate registrants without dev plugins.
              # --no-pub leaves integration_test in GeneratedPluginRegistrant.
              flutter build apk --release --split-per-abi
              flutter build appbundle --release
              ;;
            linux)
              flutter build linux --release
              ;;
            macos)
              # Flutter forwards FLUTTER_XCODE_* to Xcode build settings.
              FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO \
              FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO \
              FLUTTER_XCODE_ARCHS='arm64 x86_64' \
              FLUTTER_XCODE_ONLY_ACTIVE_ARCH=NO \
                flutter build macos --release
              ;;
            ios)
              flutter build ios --release --no-codesign
              ;;
          esac
          # Build-time regeneration must not silently upgrade locked packages.
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Verify and package native bundle
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE: ${{ matrix.package }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
          VALHALLA_ANDROID_STORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          VALHALLA_ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
        run: |
          output="$PWD/build/native-artifacts"
          mkdir -p "$output"
          name="valhalla-$PACKAGE-$BUILD_RUN"
          {
            echo "Valhalla $PACKAGE release"
            echo "developer: $VALHALLA_PUBLISHER"
            echo "organization: $VALHALLA_PUBLISHER"
            sed -n '/^version:/p' pubspec.yaml
            echo "commit: $BUILD_SHA"
            echo "run: $BUILD_RUN"
            echo "built_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            flutter --version --machine
            echo 'CI compilation is not real-device or real-server acceptance testing.'
          } > "$output/$name-BUILD-INFO.txt"
          case "$PLATFORM" in
            android)
              for abi in armeabi-v7a arm64-v8a x86_64; do
                apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
                test -s "$apk"
                signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
                test -n "$signer"
                "$signer" verify --verbose --print-certs "$apk"
                keytool -exportcert -alias "$VALHALLA_ANDROID_KEY_ALIAS" \
                  -keystore "$VALHALLA_ANDROID_KEYSTORE" \
                  -storepass:env VALHALLA_ANDROID_STORE_PASSWORD > "$RUNNER_TEMP/expected-cert.der"
                expected=$(sha256sum "$RUNNER_TEMP/expected-cert.der" | cut -d ' ' -f 1)
                # Build-tools versions label the same certificate either
                # "Signer #1" or "V2 Signer"; do not depend on that prefix.
                actual=$("$signer" verify --print-certs "$apk" | tr -d '\r' | \
                  sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\1/p' | \
                  tr 'A-F' 'a-f' | sort -u)
                test "$actual" = "$expected" || { echo 'APK signing certificate mismatch' >&2; exit 1; }
                unzip -tq "$apk"
                cp "$apk" "$output/valhalla-android-$abi-signed-$BUILD_RUN.apk"
              done
              aab=build/app/outputs/bundle/release/app-release.aab
              test -s "$aab"
              unzip -tq "$aab"
              # A self-signed Android certificate is expected; verify integrity
              # and compare its public certificate to the configured key.
              jarsigner -verify "$aab"
              keytool -printcert -jarfile "$aab" -rfc > "$RUNNER_TEMP/aab-cert.pem"
              openssl x509 -in "$RUNNER_TEMP/aab-cert.pem" -outform DER -out "$RUNNER_TEMP/aab-cert.der"
              actual=$(sha256sum "$RUNNER_TEMP/aab-cert.der" | cut -d ' ' -f 1)
              test "$actual" = "$expected" || { echo 'AAB signing certificate mismatch' >&2; exit 1; }
              cp "$aab" "$output/$name.aab"
              echo "Android release certificate SHA256: $expected" >> "$output/$name-BUILD-INFO.txt"
              echo 'Signed with the fixed release key; cannot update debug-signed installs. AAB still requires Play App Signing enrollment for Play distribution.' >> "$output/$name-BUILD-INFO.txt"
              ;;
            linux)
              bundle=build/linux/x64/release/bundle
              test -x "$bundle/valhalla"
              test -s "$bundle/lib/libflutter_linux_gtk.so"
              test -s "$bundle/lib/libvalhalla_smb.so"
              test -s "$bundle/data/icudtl.dat"
              test -d "$bundle/data/flutter_assets"
              file "$bundle/valhalla" | grep 'x86-64'
              echo 'Extract the whole bundle; requires GTK 3, libsecret and libmpv on the target Linux system.' >> "$output/$name-BUILD-INFO.txt"
              cp "$output/$name-BUILD-INFO.txt" "$bundle/BUILD-INFO.txt"
              tar -czf "$output/$name.tar.gz" -C "$bundle" .
              tar -tzf "$output/$name.tar.gz" >/dev/null
              ;;
            macos|ios)
              if [[ "$PLATFORM" == macos ]]; then
                app=build/macos/Build/Products/Release/Valhalla.app
                executable="$app/Contents/MacOS/Valhalla"
                lipo "$executable" -verify_arch x86_64 arm64
                test -d "$app/Contents/Frameworks/FlutterMacOS.framework"
              else
                app=build/ios/iphoneos/Runner.app
                executable="$app/Runner"
                lipo "$executable" -verify_arch arm64
                test -d "$app/Frameworks/Flutter.framework"
              fi
              test -s "$executable"
              # Apple linkers may produce ad-hoc arm64 signatures without a
              # certificate. Reject distribution identities, not those hashes.
              signature=$(codesign -d --verbose=4 "$app" 2>&1 || true)
              if printf '%s\n' "$signature" | grep -E '^Authority=|^TeamIdentifier=[A-Z0-9]+'; then
                echo 'Unexpected Apple signing identity in unsigned CI' >&2; exit 1
              fi
              printf '%s\n' "$signature" >> "$output/$name-BUILD-INFO.txt"
              echo 'No Apple distribution signature, provisioning or notarization. Linker ad-hoc signatures may exist. iOS ZIP is not an installable IPA.' >> "$output/$name-BUILD-INFO.txt"
              ditto -c -k --sequesterRsrc --keepParent "$app" "$output/$name.zip"
              unzip -tq "$output/$name.zip"
              ;;
          esac
          (
            cd "$output"
            for artifact in *; do
              if [[ "$PLATFORM" == macos || "$PLATFORM" == ios ]]; then
                shasum -a 256 "$artifact" > "$artifact.sha256"
              else
                sha256sum "$artifact" > "$artifact.sha256"
              fi
            done
          )
          {
            echo "### $PACKAGE release"
            echo "Developer / team: $VALHALLA_PUBLISHER"
            echo "Commit: $BUILD_SHA"
            echo 'Build outputs and SHA256 files are attached as an Artifact (14 days).'
            echo 'Android uses the fixed release key; Apple artifacts still require distribution signing.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valhalla-${{ matrix.package }}-${{ github.run_number }}
          path: build/native-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Android signing material
        if: always() && matrix.platform == 'android'
        run: |
          rm -f -- "$RUNNER_TEMP/valhalla-release.p12" "$RUNNER_TEMP/expected-cert.der" \
            "$RUNNER_TEMP/aab-cert.pem" "$RUNNER_TEMP/aab-cert.der"

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: valhalla-*-${{ github.run_number }}
          merge-multiple: true
          path: dist

      - name: Check package integrity
        working-directory: dist
        shell: bash
        run: |
          for checksum in *.sha256; do
            sha256sum --check --strict <(tr -d '\r' < "$checksum")
          done

      - name: Generate public update manifest
        env:
          BUILD_SHA: ${{ github.sha }}
        run: python3 tool/generate_update_manifest.py dist --source-commit "$BUILD_SHA"

      - name: Publish versioned native packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: |
            Developer / team: ${{ env.VALHALLA_PUBLISHER }}.
            Native builds: Android (release-signed APKs for armv7/arm64/x64 and AAB), Windows x64, Linux x64, macOS universal (unsigned), iOS arm64 (unsigned app ZIP).
            Every asset includes a SHA256 checksum; platform BUILD-INFO records the exact source commit.
            Extract the entire application ZIP and launch valhalla.exe; keep all DLLs and the data directory together.
            Requires Windows 10/11 x64 and the Microsoft Visual C++ x64 runtime. This build is unsigned.
            Android uses a fixed release key: APKs are installable, but cannot update debug-signed builds. AAB distribution requires Play App Signing enrollment. Apple packages have no distribution signature, provisioning or notarization; the iOS ZIP is NOT an installable IPA.
            Linux requires GTK 3, libsecret and libmpv runtime libraries. macOS archives include the complete app bundle.
            CI compilation and package integrity are verified; device, desktop and real-server functionality require separate acceptance testing.
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "Valhalla $RELEASE_TAG" \
            --generate-notes --notes "$RELEASE_NOTES" "${flags[@]}"
