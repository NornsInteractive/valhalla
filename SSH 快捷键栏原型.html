<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SSH 快捷键栏原型</title>
<style>
:root{--bg:#f4f4f6;--tx:#1c1c1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--tx:#eee}}
:root[data-theme="dark"]{--bg:#111214;--tx:#eee}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;display:flex;justify-content:center}
button,input{font-family:inherit}
.phone{width:100%;max-width:400px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#0d0f12;color:#d8dee9}
.term{flex:1;padding:12px;font:12px/1.6 ui-monospace,Menlo,monospace;overflow:auto;min-height:60px}
.term b{color:#7ee787}.term i{color:#79c0ff;font-style:normal}
.sheet{display:none;flex-direction:column;background:#161a20;border-radius:16px 16px 0 0;border-top:1px solid #2a2e37;max-height:50%}
.edit .sheet{display:flex}
.sh-top{display:flex;align-items:center;gap:8px;padding:10px 10px 6px}
.seg{flex:1;display:flex;background:#232730;border-radius:10px;padding:2px}
.seg button{flex:1;background:none;border:0;color:#9aa3b5;border-radius:8px;padding:6px 0;font-size:13px}
.seg button.on{background:#3a4150;color:#fff}
.done{background:#2f6fed;color:#fff;border:0;border-radius:10px;padding:7px 16px;font-size:13px;font-weight:600}
.pager{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;font-size:12px;color:#8b93a3;border-bottom:1px solid #22262e}
.pager .sp{flex:1}.pager b{color:#e6e9ef;min-width:30px;text-align:center}
.pager button,.st button,.chip,.sm{background:#2a2e37;color:#d8dee9;border:0;border-radius:8px;padding:5px 10px;font-size:12px}
.danger{color:#ff7b80!important}
.sh-body{overflow:auto;padding:8px 12px 12px}
.pills{display:flex;gap:4px;overflow-x:auto;margin-bottom:8px}
.pills button{flex:none;background:none;border:1px solid #2f3541;color:#aab2c3;border-radius:14px;padding:3px 11px;font-size:12px}
.pills button.on{background:#2f6fed22;border-color:#2f6fed;color:#8fb4ff}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.pp{flex:none;width:100%;box-sizing:border-box;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:40px;gap:6px}
.pp .chip{padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.cdots{display:flex;justify-content:center;gap:8px;margin-top:10px}.cdots i{width:6px;height:6px;border-radius:3px;background:#3a4150}.cdots i.on{background:#8fb4ff}
.chip{padding:8px 12px;font:13px ui-monospace,Menlo,monospace}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #22262e;font-size:13px}
.row:last-child{border:0}.mu{color:#8b93a3;font-size:12px}
.st{display:flex;align-items:center;gap:10px}.st button{width:32px;height:32px;border-radius:16px;font-size:17px;padding:0}.st b{min-width:18px;text-align:center}
.sw{width:44px;height:26px;border-radius:13px;border:0;background:#3a4150;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.15s}
.sw.on{background:#2f6fed}.sw.on::after{left:21px}
.sh-body input[type=text]{flex:1;min-width:80px;background:#232730;color:#e6e9ef;border:1px solid #3a4150;border-radius:8px;padding:7px 9px;font:13px ui-monospace,Menlo,monospace}
.cb{display:flex;flex-direction:column;gap:8px}.cb .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.cb .t{font-size:12px;color:#8b93a3;margin-top:4px}.pri{background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:12px}
.wide{width:100%;padding:9px}
.bar{position:relative;background:#1a1d23;border-top:1px solid #2a2e37;padding:6px 0 12px}
.edit .bar{border-top:0}
.board{position:relative;margin:0 4px;touch-action:none;user-select:none;-webkit-user-select:none}
.k{position:absolute;box-sizing:border-box;padding:3px}
.k>div,.g>div{width:100%;height:100%;box-sizing:border-box;background:#2e333d;border-radius:8px;display:flex;align-items:center;justify-content:center;font:13px ui-monospace,Menlo,monospace;color:#e6e9ef;box-shadow:0 1px 0 #0006;overflow:hidden;white-space:nowrap}
.k.act>div{background:#2f6fed}.k:active>div,.g>div:active{filter:brightness(1.3)}
.g{position:absolute;box-sizing:border-box}.g>div{position:absolute;margin:3px;background:#3a4150}
.edit .board{background:repeating-linear-gradient(#0000 0 calc(100% - 1px),#ffffff0d 0)}
.edit .k>div{outline:1px dashed #5b6475;outline-offset:-3px}
.edit .g{outline:1px dashed #5b6475;outline-offset:-2px;border-radius:8px}
.edit .sel>div,.edit .g.sel{outline:2px solid #4c8dff!important;outline-offset:-2px}
.edit .dragging{z-index:9;opacity:.85}
.dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:3px;background:#3a4150}.dots i.on{background:#8fb4ff}
#ime{display:none;height:150px;flex:none;background:#12151a;border-top:1px solid #2a2e37;align-items:center;justify-content:center;color:#6b7385;font-size:12px}
</style></head><body><div class="phone" id="app">
<div class="term" id="term"><b>root@server</b>:<i>~</i># 点按键试试；左右滑动换页；长按任意按键进入编辑</div>
<div class="sheet" id="sheet">
 <div class="sh-top"><div class="seg" id="seg"></div><button class="done" id="be">完成</button></div>
 <div class="pager">当前页<button id="bp">‹</button><b id="pg"></b><button id="bn">›</button><span class="sp"></span><button id="ba">＋ 新增页</button><button id="bx" class="danger">删除页</button></div>
 <div class="sh-body" id="shb"></div>
</div>
<div class="bar"><div class="board" id="bd"></div><div class="dots" id="dots"></div></div>
<div id="ime">（系统输入法区域）</div>
</div>
<script>
const COLS=8,CH=42,KEY='sshbar.v4',MODS=['Ctrl','Alt','Shift','Meta'],AR=[['↑',1,0],['←',0,1],['↓',1,1],['→',2,1]];
const $=id=>document.getElementById(id),bd=$('bd');
const K=(l,o)=>Object.assign({t:'k',l,s:l,w:1,h:1,kind:'key'},o);
const def=()=>{let n=0;const it=[];
 ['Esc','Tab','Ctrl','Alt','Shift','|','/','~','-'].forEach((l,i)=>{const o=K(l,{id:'d'+n++,p:0,m:MODS.includes(l)});if(i<8){o.c=i%4;o.r=i>>2}else{o.c=7;o.r=0}it.push(o)});
 it.push({id:'arrows',t:'g',c:4,r:0,w:3,h:2,p:0});
 ['Home','End','PgUp','PgDn','Ins','Del','Ctrl+C','Ctrl+D','Ctrl+Z','Ctrl+L','Ctrl+R','Ctrl+A','Ctrl+E','Ctrl+U','Ctrl+W'].forEach((l,i)=>it.push(K(l,{id:'d'+n++,p:1,kind:l.includes('+')?'combo':'key',c:i%8,r:i>>3})));
 it.push({id:'ime',t:'i',l:'⌨',w:1,h:1,p:0});return it};
let items,np=2,rows=2,page=0,edit=false,mods=new Set(),lp,imeOn=false,cat='常用',st='add',sel=null;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items)){items=d.items;np=d.np||1;rows=d.rows||2}}catch(e){}
if(!items)items=def();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({items,np,rows}))}catch(e){}};
const pos=o=>o.t==='i'?{c:COLS-1,r:rows-1,w:1,h:1}:o;
const vis=o=>o.t==='i'||o.p===page;
const hit=(o,c,r,w,h,pg=page)=>items.some(p=>{if(p===o||!(p.t==='i'||p.p===pg))return false;const q=pos(p);return c<q.c+q.w&&c+w>q.c&&r<q.r+q.h&&r+h>q.r});
const spot=(w,h,pg=page)=>{for(let r=0;r<=rows-h;r++)for(let c=0;c<=COLS-w;c++)if(!hit(null,c,r,w,h,pg))return[c,r];return null};
const lab=l=>l.replace(/Ctrl\+/g,'^').replace(/Alt\+/g,'⌥').replace(/Shift\+/g,'⇧').replace(/Meta\+/g,'⌘');
function log(t){const e=$('term'),d=document.createElement('div');d.innerHTML='<i>&gt;</i> ';d.append(t);e.appendChild(d);e.scrollTop=1e9}
function press(o){
 if(o.m){mods.has(o.l)?mods.delete(o.l):mods.add(o.l);render();return}
 const m=[...mods];
 log(o.kind==='text'?'发送文本 “'+o.s.replace(/\n/g,'⏎')+'”':(m.length?m.join('+')+'+':'')+o.s);
 mods.clear();render()}
function render(){
 const cw=bd.clientWidth/COLS;bd.style.height=CH*rows+'px';
 [...bd.querySelectorAll('.k,.g')].forEach(e=>e.remove());
 $('app').classList.toggle('edit',edit);
 $('pg').textContent=(page+1)+' / '+np;
 $('dots').innerHTML=np>1?Array.from({length:np},(_,i)=>'<i class="'+(i===page?'on':'')+'"></i>').join(''):'';
 items.filter(vis).forEach(o=>{
  const q=pos(o),e=document.createElement('div');
  e.className=(o.t==='g'?'g':'k'+(((o.m&&mods.has(o.l))||(o.t==='i'&&imeOn))?' act':''))+(edit&&o.id===sel?' sel':'');
  Object.assign(e.style,{left:q.c*cw+'px',top:q.r*CH+'px',width:q.w*cw+'px',height:q.h*CH+'px'});
  if(o.t==='g'){AR.forEach(([l,x,y])=>{const d=document.createElement('div');d.textContent=l;
    Object.assign(d.style,{left:x*cw+'px',top:y*CH+'px',width:cw-6+'px',height:CH-6+'px'});
    d.onclick=()=>{if(!edit)press({l,s:l,kind:'key'})};e.appendChild(d)})}
  else{const d=document.createElement('div'),t=lab(o.l);d.textContent=t;d.style.fontSize=t.length>4?'10px':t.length>2?'12px':'';e.appendChild(d);
   e.onclick=()=>{if(edit)return;if(o.t==='i'){imeOn=!imeOn;$('ime').style.display=imeOn?'flex':'none';render();return}press(o)}}
  e.onpointerdown=ev=>{if(o.t==='i')return;if(!edit){lp=setTimeout(()=>{edit=true;sel=o.id;st='key';render();buildSheet()},550);return}
   const sx=ev.clientX,sy=ev.clientY,ol=o.c*cw,ot=o.r*CH;let mv=false;e.setPointerCapture(ev.pointerId);
   e.onpointermove=m=>{if(!mv&&Math.hypot(m.clientX-sx,m.clientY-sy)<6)return;mv=true;e.classList.add('dragging');e.style.left=ol+m.clientX-sx+'px';e.style.top=ot+m.clientY-sy+'px'};
   e.onpointerup=()=>{if(!mv){sel=o.id;st='key';render();buildSheet();return}
    const c=Math.max(0,Math.min(COLS-o.w,Math.round(parseFloat(e.style.left)/cw))),r=Math.max(0,Math.min(rows-o.h,Math.round(parseFloat(e.style.top)/CH)));
    if(!hit(o,c,r,o.w,o.h)){o.c=c;o.r=r}
    else{const p=items.find(p=>p!==o&&p.t!=='i'&&p.p===page&&c<p.c+p.w&&c+o.w>p.c&&r<p.r+p.h&&r+o.h>p.r);
     if(p&&p.t==='k'&&o.t==='k'&&p.w===o.w&&!hit(p,o.c,o.r,p.w,p.h)){[o.c,p.c]=[p.c,o.c];[o.r,p.r]=[p.r,o.r]}}
    sel=o.id;save();render()}};
  bd.appendChild(e)})}
function place(o){const s=spot(1,1);if(!s){alert('当前页没有空位，请先新增页、增加行数或删除按键');return}
 o.id='n'+Date.now()+Math.random();o.p=page;[o.c,o.r]=s;items.push(o);sel=o.id;save();render()}
function setRows(n){n=Math.max(1,Math.min(5,n));if(n===rows)return;
 if(items.some(i=>i.t==='g')&&n<2){alert('倒T方向键需要至少 2 行，请先在「设置」里拆开方向键');return}
 const snap=JSON.stringify(items),old=rows;rows=n;
 const bad=items.filter(i=>i.t!=='i'&&(i.r+i.h>rows||(i.c+i.w>COLS-1&&i.r+i.h>rows-1)));
 for(const o of bad){o.c=-99;const s=spot(o.w,o.h,o.p);
  if(!s){items=JSON.parse(snap);rows=old;alert('第 '+(o.p+1)+' 页空间不足，请先删除或移动一些按键');return}
  [o.c,o.r]=s}
 save();render();buildSheet()}
function toggleArrows(){const g=items.find(i=>i.t==='g');
 if(g){items=items.filter(i=>i!==g);AR.forEach(([l,x,y])=>items.push(K(l,{id:'a'+l,arrow:1,p:g.p,c:g.c+x,r:g.r+y})));sel=null}
 else{if(rows<2){alert('请先把行数增加到 2 行以上');return}
  const old=items.filter(i=>i.arrow);items=items.filter(i=>!i.arrow);const s=spot(3,2);
  if(!s){items=items.concat(old);alert('当前页需要 3×2 的空位');return}
  items.push({id:'arrows',t:'g',c:s[0],r:s[1],w:3,h:2,p:page});sel='arrows'}
 save();render();buildSheet()}
const az=p=>[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(c=>p+c);
const SETS={
 '常用':['Esc','Tab','Enter','Backspace','Space','Del','Ins','Ctrl+C','Ctrl+D','Ctrl+Z','Ctrl+L','Ctrl+R','Ctrl+A','Ctrl+E','Ctrl+U','Ctrl+W','Ctrl+K'],
 'Ctrl+':az('Ctrl+').concat(['Ctrl+[','Ctrl+]','Ctrl+\\','Ctrl+Space']),
 'Alt+':az('Alt+').concat(['Alt+.','Alt+Backspace','Alt+Enter']),
 'F键':Array.from({length:12},(_,i)=>'F'+(i+1)),
 '导航':['↑','↓','←','→','Home','End','PgUp','PgDn','Ins','Del'],
 '符号':`| / \\ ~ - _ . , : ; * & ! @ # $ % ^ = + ? ' " \` ( ) [ ] { } < >`.split(' '),
 '修饰':MODS,'自定义':null};
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d};
function buildSheet(){
 const sg=$('seg');sg.innerHTML='';
 [['add','添加'],['key','按键'],['set','设置']].forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.className=k===st?'on':'';b.onclick=()=>{st=k;buildSheet()};sg.appendChild(b)});
 const p=$('shb');p.innerHTML='';
 if(st==='add')buildAdd(p);else if(st==='key')buildKey(p);else buildSet(p)}
function buildAdd(p){
 const tb=document.createElement('div');tb.className='pills';
 Object.keys(SETS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===cat?'on':'';b.onclick=()=>{cat=k;buildSheet()};tb.appendChild(b)});
 p.appendChild(tb);
 if(SETS[cat]){const L=SETS[cat],PER=12,n=Math.ceil(L.length/PER),w=document.createElement('div');w.className='car';
  for(let i=0;i<n;i++){const g=document.createElement('div');g.className='pp';
   L.slice(i*PER,i*PER+PER).forEach(l=>{const b=document.createElement('button');b.className='chip';b.textContent=l;
    b.onclick=()=>place(K(l,{m:MODS.includes(l),kind:(l.length>1&&l.includes('+'))?'combo':'key'}));g.appendChild(b)});w.appendChild(g)}
  p.appendChild(w);
  if(n>1){const ds=document.createElement('div');ds.className='cdots';
   for(let i=0;i<n;i++){const d=document.createElement('i');d.className=i?'':'on';d.onclick=()=>w.scrollTo({left:i*w.clientWidth,behavior:'smooth'});ds.appendChild(d)}
   w.onscroll=()=>{const i=Math.round(w.scrollLeft/w.clientWidth);[...ds.children].forEach((x,j)=>x.className=j===i?'on':'')};p.appendChild(ds)}
  return}
 const d=el('<div class="t" style="margin:0">自定义组合键：勾选修饰键 + 输入按键</div><div class="r">'+MODS.map(m=>'<label><input type="checkbox" data-m="'+m+'"> '+m+'</label>').join('')+'</div>'+
 '<div class="r"><input type="text" id="ck" placeholder="按键，如 C / F5 / Tab"><input type="text" id="cl" placeholder="显示名(可选)"><button class="pri" id="cadd">添加</button></div>'+
 '<div class="t">文本宏：点一下发送整段文本</div><div class="r"><input type="text" id="tl" placeholder="显示名"><input type="text" id="tt" placeholder="如 ls -la"><label><input type="checkbox" id="te" checked> 回车</label><button class="pri" id="tadd">添加</button></div>');
 d.className='cb';p.appendChild(d);
 $('cadd').onclick=()=>{let k=$('ck').value.trim();if(!k){alert('请输入按键');return}
  k=k.length===1?k.toUpperCase():k[0].toUpperCase()+k.slice(1);
  const ms=[...d.querySelectorAll('[data-m]')].filter(x=>x.checked).map(x=>x.dataset.m),s=ms.concat(k).join('+');
  place(K($('cl').value.trim()||s,{s,kind:ms.length?'combo':'key'}))};
 $('tadd').onclick=()=>{const t=$('tt').value;if(!t){alert('请输入文本');return}
  place(K($('tl').value.trim()||t.slice(0,4),{s:t+($('te').checked?'\n':''),kind:'text'}))}}
function buildKey(p){const o=items.find(i=>i.id===sel);
 if(!o){p.appendChild(el('<div class="mu" style="padding:18px 0;text-align:center">点击键盘上的按键进行选择<br>按住拖动可调整位置</div>'));return}
 if(o.t==='g'){const d=el('<div class="row"><span>方向键组<br><span class="mu">倒T形状固定，只能整体拖动</span></span><button class="sm" id="isp">拆成独立按键</button></div><div class="row"><button class="sm danger wide" id="idel">删除方向键组</button></div>');p.appendChild(d);
  $('isp').onclick=toggleArrows;$('idel').onclick=()=>{items=items.filter(i=>i!==o);sel=null;save();render();buildSheet()};return}
 const kd={key:'单键',combo:'组合键',text:'文本宏'}[o.kind]||'单键';
 const d=el('<div class="row"><span>显示名</span><input type="text" id="il"></div><div class="row"><span>发送<span class="mu"> · '+kd+'</span></span><span class="mu" id="is"></span></div><div class="row"><span>宽度（格）</span><div class="st"><button id="wm">−</button><b id="wv">'+o.w+'</b><button id="wp">＋</button></div></div><div class="row"><button class="sm danger wide" id="idel">删除这个按键</button></div>');
 p.appendChild(d);$('il').value=o.l;$('is').textContent=o.s.replace(/\n/g,'⏎');
 $('il').oninput=e=>{o.l=e.target.value||' ';save();render()};
 const sw=n=>{if(n<1||n>3||o.c+n>COLS||hit(o,o.c,o.r,n,o.h))return;o.w=n;$('wv').textContent=n;save();render()};
 $('wm').onclick=()=>sw(o.w-1);$('wp').onclick=()=>sw(o.w+1);
 $('idel').onclick=()=>{items=items.filter(i=>i!==o);sel=null;save();render();buildSheet()}}
function buildSet(p){const hg=items.some(i=>i.t==='g');
 p.appendChild(el('<div class="row"><span>键盘显示行数<br><span class="mu">1–5 行，默认 2 行</span></span><div class="st"><button id="rm">−</button><b>'+rows+'</b><button id="rp">＋</button></div></div>'+
 '<div class="row"><span>方向键倒T固定<br><span class="mu">关闭后拆成 4 个独立按键</span></span><button class="sw'+(hg?' on':'')+'" id="rs"></button></div>'+
 '<div class="row"><span>恢复默认布局</span><button class="sm danger" id="rr">重置</button></div>'));
 $('rm').onclick=()=>setRows(rows-1);$('rp').onclick=()=>setRows(rows+1);$('rs').onclick=toggleArrows;
 $('rr').onclick=()=>{if(!confirm('重置为默认布局？'))return;items=def();np=2;rows=2;page=0;sel=null;save();render();buildSheet()}}
$('be').onclick=()=>{edit=false;sel=null;render()};
$('bp').onclick=()=>{page=Math.max(0,page-1);render()};
$('bn').onclick=()=>{page=Math.min(np-1,page+1);render()};
$('ba').onclick=()=>{np++;page=np-1;save();render()};
$('bx').onclick=()=>{if(np<2){alert('至少保留一页');return}if(!confirm('删除第 '+(page+1)+' 页及其所有按键？'))return;
 items=items.filter(o=>o.t==='i'||o.p!==page);items.forEach(o=>{if(o.t!=='i'&&o.p>page)o.p--});np--;page=Math.min(page,np-1);sel=null;save();render();buildSheet()};
let sx0=0,sy0=0;
bd.addEventListener('pointerdown',e=>{sx0=e.clientX;sy0=e.clientY});
bd.addEventListener('pointerup',e=>{clearTimeout(lp);const dx=e.clientX-sx0,dy=e.clientY-sy0;
 if(!edit&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*2){page=Math.max(0,Math.min(np-1,page+(dx<0?1:-1)));render()}});
['pointercancel','pointermove'].forEach(n=>bd.addEventListener(n,()=>clearTimeout(lp)));
addEventListener('resize',render);buildSheet();render();
</script></body></html>
